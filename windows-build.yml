name: Build Windows executables

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build console debug executable
        run: python -m PyInstaller --noconfirm --clean build/sop_reporter_debug.spec

      - name: Build windowed release executable
        run: python -m PyInstaller --noconfirm --clean build/sop_reporter.spec

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: SOPReporter-Windows
          path: |
            dist/SOPReporter-Debug.exe
            dist/SOPReporter.exe
          if-no-files-found: error
