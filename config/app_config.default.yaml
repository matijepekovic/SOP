version: 1

email:
  account: ""
  imap_host: imap.gmail.com
  imap_port: 993
  mailbox: INBOX
  search:
    # Leave blank during setup so test messages are visible. Narrow these after
    # confirming the full Gmail-to-report pipeline works.
    from: ""
    subject_contains: ""
    since_days: 14
    unread_only: false
  attachments:
    filename_patterns:
      - "*.xlsx"
      - "*.xlsm"

schedule:
  enabled: true
  days:
    - monday
    - tuesday
    - wednesday
    - thursday
    - friday
  time: "07:00"
  polling_seconds: 20

output:
  downloads_directory: downloads
  reports_directory: reports
  report_filename: "Olympia_SOP_%Y-%m-%d_%H%M%S.xlsx"

printer:
  enabled: true
  # "printer" sends each report to the printer.
  # "pdf" saves a PDF next to the report instead, using the same Tabloid page
  # setup, which is the way to preview output without using paper.
  output: pdf
  # Leave blank to use the Windows/Excel default printer. For a named printer,
  # use the exact name Excel shows, including a port suffix if Excel includes it.
  name: ""
  paper_size: tabloid
  orientation: landscape
  copies: 1
  fit_to_pages_wide: 1
  fit_to_pages_tall: 0

logging:
  level: INFO
  max_bytes: 2097152
  backup_count: 5

tray:
  tooltip: SOP Reporter

update:
  # Desktop self-update. SOP Reporter checks the repository's latest published
  # release, and the "Check for Updates" button installs it and restarts.
  enabled: true
  repository: matijepekovic/SOP
  check_on_startup: true
  include_prereleases: false
