# need to collect Company — Salesforce "need to collect Company" export.
#
# This report is already filtered to a single Sub Status ("Need Collect") in
# Salesforce and carries no Sub Status column at all, so unlike GM SOP and
# Morning SOP ALL it does not split: the Olympia rows print as one document.
name: Need To Collect Company

match:
  filename_patterns:
    - "need to collect Company*.xlsx"
    - "need to collect Company*.xlsm"
  enabled: true

output:
  report_filename: "Need_To_Collect_%Y-%m-%d_%H%M%S.xlsx"

version: 1

input:
  sheet_name: null
  header_row: auto
  stop_at_first_blank_row: false
  skip_blank_rows: true

columns:
  # Market drives the filter and is hidden from the table; the title names it.
  - source: Market
    target: Market
    type: text
    required: true
    include_in_report: false
    fill_down: true
  - source: Product
    target: Product
    type: text
    required: true
    # Grouped in the export: the value appears once per group and the detail
    # rows beneath it are blank.
    fill_down: true
    width: 12
  - source: Job Number
    target: Job Number
    type: text
    required: true
    width: 13
  - source: 'Contact: Full Name'
    target: Contact Full Name
    type: text
    required: true
    width: 22
  - source: Opportunity Name
    target: Opportunity Name
    type: text
    required: true
    width: 38
  - source: Next Step-WO
    target: Next Step-WO
    type: text
    required: true
    width: 44
  - source: Amount
    target: Amount
    type: currency
    required: true
    number_format: '$#,##0.00'
    width: 14
  - source: Days in Current Sub Status
    target: Days in Current Sub Status
    type: number
    required: true
    number_format: '0.#'
    width: 15
  - source: 'Address (City)'
    target: City
    type: text
    required: true
    width: 16
  - source: 'Assigned Service Resource: Name'
    target: Assigned Resource
    type: text
    required: true
    width: 22
  - source: 'Sales Rep 1: Name'
    target: Sales Rep 1 Name
    type: text
    required: true
    width: 18
  - source: 'Sales Rep 2: Name'
    target: Sales Rep 2 Name
    type: text
    required: true
    width: 18

filters:
  mode: all
  rules:
    - column: Market
      operator: equals
      value: Olympia
      case_sensitive: false
    # Excludes Salesforce subtotal and grand-total rows.
    - column: Job Number
      operator: not_blank

# No Sub Status column exists in this report, so there is nothing to split on.
split:
  enabled: false

grouping:
  enabled: false

sort: []

report:
  worksheet_name: Need To Collect
  title: OLYMPIA — NEED TO COLLECT
  table_start_row: 4
  show_generated_at: true
  generated_at_label: Generated
  freeze_panes: auto
  auto_filter: true
  page:
    paper_size: tabloid
    orientation: landscape
    fit_to_pages_wide: 1
    fit_to_pages_tall: 0
    margin_inches: 0.2
  styles:
    title:
      font_name: Aptos Display
      font_size: 18
      bold: true
      font_color: FFFFFF
      fill_color: 172033
      alignment: left
    header:
      font_name: Aptos
      font_size: 9
      bold: true
      font_color: FFFFFF
      fill_color: 1F4E78
      alignment: center
      row_height: 30
    body:
      font_name: Aptos
      font_size: 8.5
      font_color: 111827
      fill_color: FFFFFF
      alternate_fill_color: EAF2F8
      alignment: left
      border_color: B8C4CE
      row_height: 30
