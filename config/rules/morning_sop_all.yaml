# Morning SOP ALL — Salesforce "Morning SOP ALL" export.
# Column names differ throughout from GM SOP, so this is authored separately
# rather than sharing that report's rules.
# One printed document per Sub Status.
name: Morning SOP ALL

match:
  filename_patterns:
    - "Morning SOP ALL*.xlsx"
    - "Morning SOP ALL*.xlsm"
  enabled: true

output:
  report_filename: "Morning_SOP_ALL_%Y-%m-%d_%H%M%S.xlsx"

version: 1

input:
  # null uses the workbook's active worksheet.
  sheet_name: null
  # The export opens with a title and filter banner, so the header row moves.
  header_row: auto
  stop_at_first_blank_row: false
  skip_blank_rows: true

columns:
  # Market and Sub Status drive filtering and splitting. They are hidden from
  # the printed table because the report title already names both.
  - source: Market
    target: Market
    type: text
    required: true
    include_in_report: false
    fill_down: true
  - source: Sub Status
    target: Sub Status
    type: text
    required: true
    include_in_report: false
    fill_down: true
  - source: Product
    target: Product
    type: text
    required: true
    # Grouped in the export: the value appears once per group and the detail
    # rows beneath it are blank.
    fill_down: true
    width: 12
  - source: Job Number
    target: Job Number
    type: text
    required: true
    width: 13
  - source: Contact Name
    target: Contact Name
    type: text
    required: true
    width: 22
  - source: Opportunity Name
    target: Opportunity Name
    type: text
    required: true
    width: 40
  - source: Next Step
    target: Next Step
    type: text
    required: true
    width: 46
  - source: Amount
    target: Amount
    type: currency
    required: true
    number_format: '$#,##0.00'
    width: 14
  - source: Age
    target: Age
    type: number
    required: true
    number_format: '0.#'
    width: 8
  - source: Close Date
    target: Close Date
    type: date
    required: true
    number_format: mm/dd/yyyy
    width: 12
  - source: Sales Rep 1
    target: Sales Rep 1
    type: text
    required: true
    width: 18
  - source: Sales Rep 2
    target: Sales Rep 2
    type: text
    required: true
    width: 18

filters:
  mode: all
  rules:
    - column: Market
      operator: equals
      value: Olympia
      case_sensitive: false
    # Excludes Salesforce subtotal and grand-total rows.
    - column: Job Number
      operator: not_blank

# Every distinct Sub Status remaining after the Olympia filter becomes its own
# workbook and its own print job.
split:
  enabled: true
  by: Sub Status
  title_template: 'OLYMPIA MORNING SOP — {value}'
  filename_suffix: '_{value}'
  include_blank: true
  blank_label: No Sub Status

grouping:
  enabled: false

sort: []

report:
  worksheet_name: Morning SOP
  title: OLYMPIA MORNING SOP
  table_start_row: 4
  show_generated_at: true
  generated_at_label: Generated
  freeze_panes: auto
  auto_filter: true
  page:
    paper_size: tabloid
    orientation: landscape
    fit_to_pages_wide: 1
    fit_to_pages_tall: 0
    margin_inches: 0.2
  styles:
    title:
      font_name: Aptos Display
      font_size: 18
      bold: true
      font_color: FFFFFF
      fill_color: 172033
      alignment: left
    header:
      font_name: Aptos
      font_size: 9
      bold: true
      font_color: FFFFFF
      fill_color: 1F4E78
      alignment: center
      row_height: 30
    body:
      font_name: Aptos
      font_size: 8.5
      font_color: 111827
      fill_color: FFFFFF
      alternate_fill_color: EAF2F8
      alignment: left
      border_color: B8C4CE
      row_height: 30
